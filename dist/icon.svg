<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#1c1c2e"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="60%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="amberGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#06b6d4"/>
      <stop offset="70%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fef3c7"/>
      <stop offset="60%"  stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gear tooth template -->
    <rect id="tooth" x="-11" y="-148" width="22" height="40" rx="5"
      fill="url(#amberGrad)"/>

    <!-- Clip to icon shape -->
    <clipPath id="clip"><rect width="512" height="512" rx="128"/></clipPath>

    <!-- Mask for gear ring (donut) -->
    <mask id="gearMask">
      <circle cx="0" cy="0" r="130" fill="white"/>
      <circle cx="0" cy="0" r="78"  fill="black"/>
    </mask>
  </defs>

  <!-- ─── BACKGROUND ──────────────────────────────────── -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <ellipse cx="256" cy="256" rx="210" ry="210" fill="url(#ambientGlow)" clip-path="url(#clip)"/>

  <!-- ─── GRID ──────────────────────────────────────────── -->
  <g clip-path="url(#clip)" stroke="#f59e0b" stroke-width="0.8" opacity="0.12" fill="none">
    <line x1="64"  y1="128" x2="448" y2="128"/>
    <line x1="64"  y1="192" x2="448" y2="192"/>
    <line x1="64"  y1="320" x2="448" y2="320"/>
    <line x1="64"  y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64"  x2="128" y2="448"/>
    <line x1="192" y1="64"  x2="192" y2="448"/>
    <line x1="320" y1="64"  x2="320" y2="448"/>
    <line x1="384" y1="64"  x2="384" y2="448"/>
  </g>
  <!-- Grid nodes -->
  <g fill="#f59e0b" opacity="0.2">
    <circle cx="128" cy="128" r="3.5"/><circle cx="384" cy="128" r="3.5"/>
    <circle cx="128" cy="384" r="3.5"/><circle cx="384" cy="384" r="3.5"/>
    <circle cx="192" cy="192" r="2.5"/><circle cx="320" cy="192" r="2.5"/>
    <circle cx="192" cy="320" r="2.5"/><circle cx="320" cy="320" r="2.5"/>
  </g>

  <!-- ─── CIRCUIT TRACES ─────────────────────────────── -->
  <g clip-path="url(#clip)" fill="none" stroke="#f59e0b" stroke-width="1.5"
     stroke-linecap="round" opacity="0.35">
    <path d="M128 128 L192 128 L192 192"/>
    <path d="M384 128 L320 128 L320 192"/>
    <path d="M128 384 L192 384 L192 320"/>
    <path d="M384 384 L320 384 L320 320"/>
  </g>
  <!-- Animated pulses on traces -->
  <g clip-path="url(#clip)" fill="none" stroke="#fde68a" stroke-width="4"
     stroke-linecap="round">
    <path d="M128 128 L192 128 L192 192" stroke-dasharray="14 240" opacity="0">
      <animate attributeName="stroke-dashoffset" from="240" to="-240" dur="2.6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.6s" repeatCount="indefinite" begin="0s"/>
    </path>
    <path d="M384 128 L320 128 L320 192" stroke-dasharray="14 240" opacity="0">
      <animate attributeName="stroke-dashoffset" from="240" to="-240" dur="2.6s" repeatCount="indefinite" begin="0.65s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.6s" repeatCount="indefinite" begin="0.65s"/>
    </path>
    <path d="M384 384 L320 384 L320 320" stroke-dasharray="14 240" opacity="0">
      <animate attributeName="stroke-dashoffset" from="240" to="-240" dur="2.6s" repeatCount="indefinite" begin="1.3s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.6s" repeatCount="indefinite" begin="1.3s"/>
    </path>
    <path d="M128 384 L192 384 L192 320" stroke-dasharray="14 240" opacity="0">
      <animate attributeName="stroke-dashoffset" from="240" to="-240" dur="2.6s" repeatCount="indefinite" begin="1.95s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.6s" repeatCount="indefinite" begin="1.95s"/>
    </path>
  </g>

  <!-- ─── OUTER ORBIT RING (slow, dashed amber) ───────── -->
  <g transform="translate(256,256)">
    <circle r="218" fill="none" stroke="#f59e0b" stroke-width="1.5"
      stroke-dasharray="6 22" stroke-linecap="round" stroke-opacity="0.3">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="32s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ─── MID ORBIT RING (counter-clockwise, cyan) ─────── -->
  <g transform="translate(256,256)">
    <circle r="186" fill="none" stroke="#06b6d4" stroke-width="1.5"
      stroke-dasharray="3 26" stroke-linecap="round" stroke-opacity="0.35">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="-360" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ─── CLEAN GEAR ──────────────────────────────────────
       Strategy: 8 rounded-rect teeth + a donut ring
       All centered at (256,256), single rotation animation
  ──────────────────────────────────────────────────────── -->
  <g transform="translate(256,256)" filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="14s" repeatCount="indefinite"/>

      <!-- 8 teeth (rotated rect clones) -->
      <use href="#tooth" transform="rotate(0)"/>
      <use href="#tooth" transform="rotate(45)"/>
      <use href="#tooth" transform="rotate(90)"/>
      <use href="#tooth" transform="rotate(135)"/>
      <use href="#tooth" transform="rotate(180)"/>
      <use href="#tooth" transform="rotate(225)"/>
      <use href="#tooth" transform="rotate(270)"/>
      <use href="#tooth" transform="rotate(315)"/>

      <!-- Gear body: donut ring -->
      <circle r="130" fill="url(#amberGrad)" mask="url(#gearMask)" opacity="0.92"/>

      <!-- Sheen / highlight on gear ring -->
      <circle r="130" fill="none" stroke="#fde68a" stroke-width="2.5"
        stroke-opacity="0.5" mask="url(#gearMask)"/>
    </g>
  </g>

  <!-- ─── INNER DISC (covers gear hole, dark) ──────────── -->
  <circle cx="256" cy="256" r="74" fill="#0f0f1a"/>

  <!-- ─── INNER GLOW RING ───────────────────────────────── -->
  <circle cx="256" cy="256" r="70" fill="none" stroke="#f59e0b" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ─── CORE HEX + PULSE ──────────────────────────────── -->
  <g transform="translate(256,256)" filter="url(#strongGlow)">
    <!-- Pulsing glow disk -->
    <circle r="28" fill="#f59e0b" fill-opacity="0.1">
      <animate attributeName="r" values="22;36;22" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.1;0.25;0.1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Hexagon -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14"
      fill="url(#amberGrad)" opacity="0.95">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
    <!-- Center dot -->
    <circle r="8" fill="#fef3c7">
      <animate attributeName="r" values="6;10;6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ─── HOLOGRAPHIC SCAN LINE ─────────────────────────── -->
  <g clip-path="url(#clip)">
    <rect x="60" y="0" width="392" height="3" fill="url(#cyanGrad)" rx="1.5" opacity="0">
      <animate attributeName="y" values="72;440;72" dur="3.8s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.04;0.94;1"
        dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="0" width="392" height="18" fill="#06b6d4" rx="9" opacity="0">
      <animate attributeName="y" values="63;431;63" dur="3.8s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0;0.06;0.06;0" keyTimes="0;0.04;0.94;1"
        dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ─── HUD CORNER BRACKETS ──────────────────────────── -->
  <g stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"
     opacity="0.65" filter="url(#softGlow)">
    <path d="M 72,116 L 72,72 L 116,72"/>
    <path d="M 440,116 L 440,72 L 396,72"/>
    <path d="M 72,396 L 72,440 L 116,440"/>
    <path d="M 440,396 L 440,440 L 396,440"/>
  </g>
  <!-- Bracket blink overlay -->
  <g stroke="#fde68a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 72,116 L 72,72 L 116,72" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M 440,116 L 440,72 L 396,72" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 72,396 L 72,440 L 116,440" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 440,396 L 440,440 L 396,440" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ─── BOTTOM TEXT ──────────────────────────────────── -->
  <!-- Divider line -->
  <line x1="120" y1="406" x2="392" y2="406"
    stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Left & right diamond accents -->
  <polygon points="108,406 118,400 128,406 118,412" fill="#f59e0b" opacity="0.5"/>
  <polygon points="404,406 394,400 384,406 394,412" fill="#f59e0b" opacity="0.5"/>

  <!-- Top label: CMM · SMS -->
  <text x="256" y="432"
    font-family="'Courier New', Consolas, monospace"
    font-size="22" font-weight="700"
    fill="#f59e0b" text-anchor="middle"
    letter-spacing="8"
    filter="url(#softGlow)">CMM · SMS
    <animate attributeName="fill-opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom label: STORE REGISTER -->
  <text x="256" y="458"
    font-family="'Courier New', Consolas, monospace"
    font-size="14" font-weight="400"
    fill="#94a3b8" text-anchor="middle"
    letter-spacing="5">STORE REGISTER
  </text>

  <!-- ─── OUTER BORDER GLOW ─────────────────────────────── -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none"
    stroke="#f59e0b" stroke-width="3">
    <animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none"
    stroke="#f59e0b" stroke-width="1" stroke-opacity="0.12"/>
</svg>
